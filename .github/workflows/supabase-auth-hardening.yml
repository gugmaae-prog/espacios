name: Supabase Auth Hardening

on:
  pull_request:
    paths:
      - "scripts/harden-supabase-auth.mjs"
      - ".github/workflows/supabase-auth-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply scoped Supabase Auth hardening
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/harden-supabase-auth.mjs
